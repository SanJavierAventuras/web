<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actividades | San Javier Experiencias</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../IMG/pestana.png">

    <style>
        /* Estos estilos afectan únicamente a la sección de experiencias. */

        .experiencias {
            width: min(1180px, calc(100% - 48px));
            margin: 0 auto;
            padding: 145px 0 70px;
        }

        .experiencias-intro {
            margin-bottom: 32px;
        }

        .experiencias-etiqueta {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 12px;
            color: #af350f;
            font-size: 11px;
            font-weight: 750;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .experiencias-etiqueta::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #af350f;
        }

        .experiencias-titulo {
            margin: 0;
            color: #171b17;
            font-size: clamp(32px, 4.4vw, 54px);
            font-weight: 900;
            line-height: 1.06;
            letter-spacing: -.045em;
            text-transform: uppercase;
        }

        .experiencias-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 20px;
        }

        .experiencia {
            --entrada: 0ms;

            position: relative;
            isolation: isolate;
            grid-column: span 2;
            display: block;
            height: 210px;
            overflow: hidden;
            border-radius: 12px;
            background: #dce3d8;
            color: white;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;

            animation: experiencia-entrada .7s ease var(--entrada) both;

            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }

        .experiencia:nth-child(2) {
            --entrada: 70ms;
        }

        .experiencia:nth-child(3) {
            --entrada: 140ms;
        }

        .experiencia:nth-child(4) {
            --entrada: 210ms;
            grid-column: span 3;
        }

        .experiencia:nth-child(5) {
            --entrada: 280ms;
            grid-column: span 3;
        }

        .experiencia img {
            position: absolute;
            inset: 0;
            z-index: -3;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition:
                transform .8s cubic-bezier(.2, .7, .2, 1),
                filter .5s ease;
        }

        .experiencia::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -2;

            background: linear-gradient(180deg,
                    rgba(8, 24, 17, .02) 15%,
                    rgba(8, 24, 17, .18) 45%,
                    rgba(8, 24, 17, .78) 100%);
        }

        .experiencia::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            border: 1px solid transparent;
            border-radius: inherit;
            pointer-events: none;

            transition: border-color .3s ease;
        }

        .experiencia-contenido {
            position: absolute;
            left: 23px;
            right: 23px;
            bottom: 23px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
        }

        .experiencia-nombre {
            margin: 0;
            color: white;
            font-size: 25px;
            font-weight: 850;
            line-height: 1.05;
            letter-spacing: -.025em;
            text-transform: uppercase;
            text-shadow: 0 2px 18px rgba(0, 0, 0, .15);

            transition: transform .3s ease;
        }

        .experiencia-ver {
            display: block;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            color: #ffffffdf;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .05em;
            text-transform: uppercase;

            transition:
                opacity .3s ease,
                max-height .3s ease,
                margin-top .3s ease;
        }

        .experiencia-flecha {
            flex-shrink: 0;
            width: 25px;
            height: 25px;
            margin-bottom: 2px;

            transition:
                transform .3s ease,
                color .3s ease;
        }

        .experiencia-flecha svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .experiencia:focus-visible {
            outline: 3px solid #af350f;
            outline-offset: 5px;
        }

        /* Encuadre de las fotografías */

        .experiencia-largo img {
            object-position: center 48%;
        }

        .experiencia-corto img {
            object-position: center 43%;
        }

        .experiencia-cabalgata img {
            object-position: center 43%;
        }

        .experiencia-granja img {
            object-position: center 65%;
        }

        .experiencia-cena img {
            object-position: center 57%;
        }

        @keyframes experiencia-entrada {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animaciones para computadoras */

        @media (hover: hover) and (pointer: fine) {
            .experiencia:hover {
                transform: translateY(-4px);
                box-shadow: 0 13px 28px rgba(25, 48, 33, .14);
            }

            .experiencia:hover img {
                transform: scale(1.07);
            }

            .experiencia:hover::after {
                border-color: rgba(255, 255, 255, .35);
            }

            .experiencia:hover .experiencia-ver {
                opacity: 1;
                max-height: 20px;
                margin-top: 9px;
            }

            .experiencia:hover .experiencia-flecha {
                transform: translateX(5px);
                color: #ffd2ab;
            }
        }

        /* Tablets */

        @media (max-width: 950px) {
            .experiencias-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 18px;
            }

            .experiencia,
            .experiencia:nth-child(4),
            .experiencia:nth-child(5) {
                grid-column: auto;
            }

            .experiencia:nth-child(5) {
                grid-column: 1 / -1;
            }

            .experiencia-nombre {
                font-size: 26px;
            }
        }

        /* Celulares */

        @media (max-width: 600px) {
            .experiencias {
                width: calc(100% - 36px);
                padding: 120px 0 40px;
            }

            .experiencias-intro {
                margin-bottom: 25px;
            }

            .experiencias-etiqueta {
                font-size: 9px;
                letter-spacing: .11em;
                margin-bottom: 12px;
            }

            .experiencias-titulo {
                max-width: 350px;
                font-size: clamp(31px, 8.8vw, 39px);
                line-height: 1.05;
            }

            .experiencias-grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 15px;
            }

            .experiencia,
            .experiencia:nth-child(4),
            .experiencia:nth-child(5) {
                grid-column: auto;
                height: 190px;
                border-radius: 11px;
            }

            .experiencia-contenido {
                left: 21px;
                right: 21px;
                bottom: 21px;
            }

            .experiencia-nombre {
                font-size: 26px;
                line-height: 1.05;
            }

            .experiencia-ver {
                opacity: 1;
                max-height: 20px;
                margin-top: 8px;
                font-size: 9px;
            }

            .experiencia-flecha {
                width: 25px;
                height: 25px;
                margin-bottom: 1px;
            }

            .experiencia:active {
                transform: scale(.98);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .experiencia,
            .experiencia *,
            .experiencia::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body class="font-sans bg-white">

            <button id="menu-btn" type="button" class="md:hidden text-gray-700 text-3xl focus:outline-none"

        </section>
    </main>

    <script>
        const menuButton = document.getElementById("menu-btn");
        const menu = document.getElementById("menu");

        menuButton.addEventListener("click", () => {
            const open = menu.classList.contains("hidden");

            menu.classList.toggle("hidden");
            menuButton.setAttribute("aria-expanded", String(open));
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                menu.classList.add("hidden");
                menuButton.setAttribute("aria-expanded", "false");
            }
        });
    </script>

</body>

</html>
